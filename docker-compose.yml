version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardianmesh-db
    environment:
      POSTGRES_DB: guardianmesh_db
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: guardian_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_user -d guardianmesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: guardianmesh-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://guardian_user:guardian_pass@postgres:5432/guardianmesh_db
      - AWS_REGION=us-east-1
      - BEDROCK_MODEL_ID=anthropic.claude-3-5-sonnet-20241022-v2:0
      - AI_PROVIDER=mock
      - RING_MODE=simulator
      - MCP_PORT=8100
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: guardianmesh-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
